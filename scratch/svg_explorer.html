<!DOCTYPE html>
<html>
<head>
    <style>
        svg { width: 500px; height: 800px; border: 1px solid #ccc; }
        path:hover { fill: red !important; cursor: pointer; }
        .label { font-family: sans-serif; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="svg-container"></div>
    <div id="info">Hover a muscle to see index</div>
    <script>
        fetch('body front.svg')
            .then(r => r.text())
            .then(text => {
                const container = document.getElementById('svg-container');
                container.innerHTML = text;
                const svg = container.querySelector('svg');
                const paths = svg.querySelectorAll('path');
                paths.forEach((p, i) => {
                    p.setAttribute('data-index', i);
                    p.addEventListener('mouseover', () => {
                        document.getElementById('info').innerText = 'Path Index: ' + i;
                    });
                });
            });
    </script>
</body>
</html>
